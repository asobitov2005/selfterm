[workspace]
resolver = "2"
members = ["crates/selfterm-core", "crates/selfterm-protocol", "apps/client/src-tauri"]
default-members = ["crates/selfterm-core", "crates/selfterm-protocol"]
exclude = ["probes/cross-platform/src-tauri", "probes/cross-platform/ssh-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

